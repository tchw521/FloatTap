name: 构建 APK

# 这个项目不用 Gradle，构建链只有 aapt2 / javac / d8 / zipalign / apksigner，
# 所以 CI 里不需要装 Gradle，也不用联网拉依赖——装个 Android SDK 就能跑。
#
# 怎么用：
#   推代码 / 提 PR        → 自动编译一遍，产物在 Actions 页面下载
#   推 tag（v2.0.0 这种） → 额外发一个 Release，APK 挂在 Release 里
#   手动触发               → 可以在 Actions 页面手填版本号

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（留空：打 tag 就用 tag 名，否则用 git describe）'
        required: false
      version_code:
        description: '版本码（整数，要递增；留空用本次运行序号）'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: 纯 Java 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 跑单测（条件系统 + 分享码）
        run: bash tools/test/run-tests.sh

  build:
    name: 编译并签名
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 没 tag 历史的话 git describe 推不出版本号

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=$HOME/android-sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ] && [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "SDK 已经是 34，直接用"
          elif [ -n "$SM" ]; then
            yes 2>/dev/null | "$SM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"
          else
            echo "::error::既没有 build-tools 34.0.0，也找不到 sdkmanager"
            exit 1
          fi
          ls -l "$ANDROID_HOME/build-tools/34.0.0/aapt2" "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: 算版本号
        id: ver
        run: |
          set -euo pipefail
          NAME="${{ inputs.version_name }}"
          CODE="${{ inputs.version_code }}"
          [ -n "$NAME" ] || { [ "${{ github.ref_type }}" = "tag" ] && NAME="${GITHUB_REF_NAME#v}"; }
          [ -n "$NAME" ] || NAME="$(git describe --tags --always 2>/dev/null || echo dev)"
          # 版本号会进文件名，只留安全字符
          NAME="$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '-')"
          [ -n "$CODE" ] || CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建：v$NAME（版本码 $CODE）"

      - name: 准备签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > lazytap.jks
            echo "用的是 secrets 里的签名密钥"
          else
            echo "::warning::没配 KEYSTORE_BASE64，用仓库里自带的开发密钥。正式发布建议换成自己的密钥，否则换机器就得卸载重装。"
          fi

      - name: 构建
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x build.sh tools/test/run-tests.sh
          ./build.sh "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}"

      - name: 校验产物
        run: |
          APK="out/LazyTap-v${{ steps.ver.outputs.name }}.apk"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -4

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: LazyTap-v${{ steps.ver.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
